<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆配对游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>记忆配对游戏</h1>
            <div class="game-info">
                <div class="timer">时间: <span id="time">0</span>秒</div>
                <div class="moves">步数: <span id="moves">0</span></div>
                <button id="restart">重新开始</button>
            </div>
            <div class="difficulty">
                <button data-size="4" class="active">4 x 4</button>
                <button data-size="6">6 x 6</button>
            </div>
        </header>
        
        <div id="game-board"></div>
        
        <div id="win-message" class="hidden">
            <div class="message-content">
                <h2>恭喜你赢了！🎉</h2>
                <p>用时: <span id="final-time">0</span>秒</p>
                <p>总步数: <span id="final-moves">0</span></p>
                <button id="play-again">再玩一次</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
